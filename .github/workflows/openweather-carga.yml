name: Carga OpenWeather

on:
  workflow_dispatch:
    inputs:
      limit_cidades:
        description: "Limite de cidades (0 = todas)"
        required: false
        default: "0"
      sleep_seconds:
        description: "Pausa entre chamadas API"
        required: false
        default: "1.2"
  schedule:
    - cron: "0 9 * * *"

jobs:
  carga-openweather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-openweather.txt

      - name: Run ingestion
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
          OWM_UNITS: metric
          OWM_LANG: pt_br
        run: |
          LIMIT_CIDADES="${{ github.event.inputs.limit_cidades || '0' }}"
          SLEEP_SECONDS="${{ github.event.inputs.sleep_seconds || '1.2' }}"
          python src/openweather/carga_openweather.py --limit-cidades "$LIMIT_CIDADES" --sleep-seconds "$SLEEP_SECONDS"
